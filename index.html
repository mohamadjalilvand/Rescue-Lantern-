<style>

body{margin:0;font-family:'Vazirmatn',system-ui,sans-serif;background:radial-gradient(1000px 500px at 15% -10%,rgba(196,136,76,.07),transparent 60%),var(--bg);color:var(--tx);line-height:1.85;padding-inline:0}

.w{max-width:1140px;margin-inline:auto;padding-inline:20px}
nav{position:sticky;top:0;z-index:50;background:rgba(10,13,18,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}

.logo{font-weight:800;color:var(--cu2);white-space:nowrap}

.lang{position:relative;margin-inline-start:auto}.links+.lang{margin-inline-start:0}
.lang button{background:var(--panel2);color:var(--tx);border:1px solid var(--line2);border-radius:10px;padding:6px 12px;font:inherit;font-size:.88rem;cursor:pointer;min-height:40px}
.lang ul{display:none;position:absolute;inset-inline-end:0;top:46px;margin:0;padding:6px;list-style:none;background:var(--panel);border:1px solid var(--line2);border-radius:12px;min-width:140px}
.lang.open ul{display:block}.lang li button{width:100%;text-align:start;border:0;background:none;padding:8px 10px;border-radius:8px}
.lang li button:hover,.lang li button[aria-current=true]{background:var(--cus);color:var(--cu2)}
@media(max-width:860px){.links{display:none}.lang{margin-inline-start:auto}}
section{padding:72px 0;border-bottom:1px solid var(--line)}
.hero{padding:56px 0 72px}
.cover{position:relative;border:1px solid var(--line2);border-radius:26px;background:linear-gradient(180deg,var(--panel2),var(--panel));overflow:hidden;padding:clamp(24px,5vw,56px)}

.cover>*:not(svg){position:relative}
.award{display:inline-flex;gap:10px;align-items:center;border:1.5px solid var(--cu);background:var(--cus);color:var(--cu2);border-radius:999px;padding:7px 18px;font-weight:700;font-size:.85rem;letter-spacing:.04em}
.note{font-size:.78rem;color:var(--di);margin:6px 0 0}
h1{font-size:clamp(1.9rem,5vw,3.4rem);line-height:1.3;margin:18px 0 12px;font-weight:800;max-width:18em}
h2{font-size:clamp(1.5rem,3.4vw,2.2rem);line-height:1.4;margin:0;font-weight:800}
h3{margin:0 0 6px;font-size:1.05rem}
.sub{color:var(--st);font-size:1.05rem;max-width:44em;font-weight:600}
.p{color:var(--mu);max-width:48em}
.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.b{display:inline-flex;align-items:center;min-height:48px;padding:0 24px;border-radius:12px;font-weight:700;border:1.5px solid var(--cu);cursor:pointer}

.head{display:flex;gap:16px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:28px}
.num{width:44px;height:44px;min-width:44px;display:grid;place-items:center;border-radius:12px;border:1.5px solid var(--cu);color:var(--cu2);background:var(--cus);font-weight:800;direction:ltr}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:24px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.g4{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}

.card p{margin:0;color:var(--mu);font-size:.95rem}.card h3{color:var(--tx)}
.tag{display:inline-block;padding:3px 12px;border-radius:999px;background:var(--sts);color:var(--st);border:1px solid rgba(127,162,194,.25);font-size:.78rem;font-weight:700;margin:3px}
.tag.opt{border-style:dashed;color:var(--cu2);background:var(--cus);border-color:var(--cu)}

.flip{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:22px;font-weight:800;font-size:.9rem;letter-spacing:.03em}
.flip span:first-child{color:var(--di)}.flip span:last-child{color:var(--cu2)}
.arch{display:grid;grid-template-columns:1fr 2fr 1fr;gap:18px;align-items:center;margin:28px 0}
@media(max-width:860px){.arch{grid-template-columns:1fr}}
.flow{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.node{border:1px solid var(--cu);background:var(--cus);border-radius:12px;padding:10px 14px;text-align:center;font-size:.85rem;font-weight:700;direction:ltr}
.node.rtlok{direction:inherit}.arrow{text-align:center;color:var(--cu2);line-height:1;animation:fl 2s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(3px);opacity:.5}}
.side{border:1.5px dashed var(--st);border-radius:14px;padding:14px;color:var(--st);font-size:.88rem;text-align:center}
.legend{font-size:.78rem;color:var(--di);display:flex;gap:18px;flex-wrap:wrap}
.tl{display:grid;grid-template-columns:repeat(3,1fr);gap:0;position:relative}
.tl .st{padding:0 18px;border-inline-start:2px solid var(--line2);position:relative}
.tl .st:before{content:'';position:absolute;inset-inline-start:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--cu)}
.tl h3{color:var(--cu2)}
@media(max-width:860px){.tl{grid-template-columns:1fr;gap:28px}}
.qual{border-inline-start:3px solid var(--st);padding:8px 16px;color:var(--di);font-size:.85rem;margin-top:26px}
footer{padding:64px 0 40px;background:var(--panel)}
.ct{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:28px 0}
.c{display:flex;gap:12px;align-items:center;min-height:56px;padding:12px 16px;border:1px solid var(--line2);border-radius:14px;background:var(--panel2);direction:ltr;word-break:break-all}
.c svg{flex:none;width:22px;height:22px;stroke:var(--cu2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
a.c:hover{border-color:var(--cu)}.c.off{opacity:.55;border-style:dashed}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important;transition:none!important}}
.rv{opacity:0;transform:translateY(14px);transition:.6s}.rv.in{opacity:1;transform:none}
</style>

['جلیقه هوشمند صنعتی','پلتفرم پوشیدنی صنعتی برای گسترش پایش نیروها با ظرفیت حسگری بیشتر، یکپارچه‌سازی ماژولار و پشتیبانی از محیط‌های عملیاتی سخت.','حسگرهای اختیاری و وابسته به پیکربندی: CO، متان، VOC، فشار، شاخص‌های فیزیولوژیک.'],
['شبکه Gateway هوشمند','گره‌های ارتباطی و پردازش لبه‌ای توزیع‌شده برای جمع‌آوری اطلاعات عملیاتی، پالایش و سازمان‌دهی داده‌ها و ارسال اطلاعات مرتبط از مسیرهای ارتباطی موجود.','جمع‌آوری داده · پردازش اولیه · پل ارتباطی · سابقه عملیاتی · تاب‌آوری شبکه'],
['سامانه Seeker','دستگاه‌های امدادی قابل‌حمل و ثابت برای کمک به تیم‌های جست‌وجو در تشخیص مجاورت، فعال‌سازی مغناطیسی و تأیید مصدوم در فاصله نزدیک.','Seekerهای قابل‌حمل می‌توانند عملکردهای امدادی پوشیدنی‌های سازگار را در فاصله نزدیک فعال کنند.'],
['گره‌های رله پهپادی (اختیاری)','رله‌های ارتباطی هوایی قابل‌استقرار برای گسترش اتصال، هنگامی که زیرساخت ثابت در دسترس یا کافی نیست.','ارتقای اختیاری است؛ هسته اکوسیستم به آن نیاز ندارد.'],
['مرکز فرماندهی هوشمند (AI)','رابط عملیاتی متمرکز که اطلاعات میدانی موجود را برای پشتیبانی از آگاهی از حادثه، هماهنگی منابع، تحلیل عملیاتی و تصمیم‌گیری انسانی یکجا می‌کند.','هوش مصنوعی پشتیبان تصمیم است. تصمیم نهایی امداد با اپراتورهای انسانیِ مسئول است.'],
['دوقلوی دیجیتال / مدل عملیاتی','محیط نمایش عملیاتی برای ترکیب اطلاعات زیرساختی موجود با داده‌های میدانی تا هماهنگ‌کنندگان وضعیت نیروها، محدوده حادثه، شرایط زیرساخت و پیشرفت امداد را بهتر تفسیر کنند.','در سطح مفهوم و معماری نرم‌افزار؛ به‌عنوان محصول سه‌بعدی بلادرنگ اعتبارسنجی‌شده ارائه نمی‌شود.']],
flow:['پوشیدنی‌ها + حسگرهای محیطی','Gatewayها + مسیرهای ارتباطی موجود','پردازش لبه‌ای + تجمیع داده','مرکز فرماندهی با کمک هوش مصنوعی','مدل عملیاتی دیجیتال + تصمیم‌گیری انسانی'],
sk:'Seekerهای قابل‌حمل — مؤلفه پشتیبان در فاصله نزدیک',dr:'گره‌های رله پهپادی اختیاری — پشتیبان گسترش ارتباط',lg1:'کادرهای توپر: جریان اطلاعات در معماری اصلی',lg2:'کادرهای خط‌چین: مؤلفه‌های پشتیبان/اختیاری و روابط مفهومی',
aiNote:'قابلیت‌های مؤلفه‌ها نیت طراحی هستند، به پیکربندی نهایی بستگی دارند و ادعای عملکرد اعتبارسنجی‌شده نیستند.',
s4t:'از پایش روزمره تا پشتیبانی امداد در فاصله نزدیک.',
st:[['مرحله ۰۱ — آگاهی روزمره','در عملیات روزمره، پوشیدنی‌های سازگار به‌صورت دوره‌ای اطلاعات عملیاتی سبک را به Gatewayهای مجاور ارسال می‌کنند. این کار می‌تواند ضمن صرفه‌جویی در انرژی، به نگهداری سوابق وضعیت دستگاه، تاریخچه ارتباط و سایر داده‌های پایش پیکربندی‌شده کمک کند.'],
['مرحله ۰۲ — واکنش اضطراری','با شناسایی شرایط اضطراریِ پیکربندی‌شده، پوشیدنی می‌تواند به حالت اضطراری برود. بسته به پیاده‌سازی، این امر ممکن است شامل ارتباطات اولویت‌دار، پایش مستمر حادثه و آمادگی برای عملکردهای امدادی بیشتر باشد.'],
['مرحله ۰۳ — تأیید در فاصله نزدیک','تیم‌های امداد با سوابق عملیاتی موجود و تجهیزات جست‌وجو محدوده را دقیق‌تر می‌کنند. با نزدیک شدن امدادگران به پوشیدنی سازگار، Seeker می‌تواند فعال‌سازی مغناطیسی فرکانس‌پایین را آغاز کند و عملکردهای پیکربندی‌شده‌ی نزدیک، مانند بیکن مغناطیسی، سیگنال مجاورت بلوتوث و هشدار صوتی را فعال کند.']],
tech:['ارتباط کم‌مصرف','LoRa (در صورت پیکربندی)','Bluetooth Low Energy','فعال‌سازی مغناطیسی فرکانس‌پایین','ارتباط مبتنی بر مش','پردازش لبه‌ای توزیع‌شده','پشتیبانی تصمیم با هوش مصنوعی','نمایش دوقلوی دیجیتال'],

s5t:'ساخته‌شده بر پایه نیازهای عملیات پرخطر.',s5p:'Rescue Lantern برای پشتیبانی از سازمان‌هایی در نظر گرفته شده که مسئول ایمنی نیروها و آمادگی اضطراری در محیط‌هایی‌اند که حفظ آگاهی عملیاتی در آن‌ها به‌ویژه دشوار است.',

road:'پروژه از راهبرد توسعه مرحله‌ای پیروی می‌کند: توسعه مهندسی، اعتبارسنجی آزمایشگاهی، ارزیابی میدانی، گواهی‌نامه، تولید اولیه و گسترش بازار. این یک نقشه راه است، نه ادعای تکمیل همه مراحل.',
paths:[['ارزیابی فنی','بررسی معماری، گفت‌وگو درباره الزامات استقرار و ارزیابی امکان یکپارچه‌سازی فنی.'],['استقرار آزمایشی','بحث درباره الزامات یک ارزیابی میدانی کنترل‌شده و شرکای عملیاتی بالقوه.'],['مشارکت راهبردی','بررسی همکاری صنعتی، مشارکت پژوهشی، ساخت، تجاری‌سازی و فرصت‌های سرمایه‌گذاری.']],

ar:{dir:'rtl',name:'العربية',title:'Rescue Lantern™ — منظومة متكاملة للاستجابة للطوارئ',desc:'منظومة متكاملة للاستجابة للطوارئ مصمَّمة لدعم مراقبة الأفراد والاتصالات المرنة وتحديد مواقع المصابين والوعي التشغيلي بمساعدة الذكاء الاصطناعي في البيئات الصعبة.',

h1:'حين تكون كل إشارة مهمة، يجب أن يذهب ذكاء الإنقاذ إلى أبعد.',
sub:'يربط Rescue Lantern الأجهزة القابلة للارتداء الذكية والاتصالات المرنة وتقنيات الإنقاذ الموضعية والذكاء التشغيلي في منظومة واحدة متناسقة.',
intro:'Rescue Lantern منظومة متكاملة للاستجابة للطوارئ، صُمّمت لبيئات صعبة قد تصبح فيها أنظمة تحديد المواقع والاتصال التقليدية غير موثوقة. ومن خلال ربط الأجهزة الذكية القابلة للارتداء وبنية الاتصال المرنة وتقنيات الإنقاذ الموضعية والعرض التشغيلي المدعوم بالذكاء الاصطناعي، يهدف المشروع إلى تعزيز الوعي بالموقف قبل الطوارئ وأثناءها وبعدها.',
cta1:'ناقشوا معنا الشراكة',cta2:'اكتشف التقنية',
s2t:'مصمَّم للبيئات التي قد تفشل فيها الأنظمة التقليدية.',chT:'التحدي',
chP:'يمكن للمناجم الجوفية والأنفاق والمساحات الصناعية المغلقة والمباني المتضررة إنشائيًا أن تحدّ بشدة من تحديد المواقع عبر الأقمار الصناعية وأن تعطّل بنية الاتصال التقليدية. وعندها قد تكون لدى فرق الإنقاذ معلومات ناقصة عن حالة الأفراد وآخر مناطق العمل المعروفة وتوافر الاتصال والظروف البيئية.',
ch:['تراجع توافر الاتصالات','محدودية الرؤية لحالة الأفراد','صعوبة تحديد مواقع المصابين','تشتت المعلومات التشغيلية'],
soT:'نهج Rescue Lantern',soP:'يجمع Rescue Lantern مراقبة الأفراد والاتصالات متعددة الطبقات والمعالجة الموزعة والكشف الموضعي عن المصابين والذكاء التشغيلي المركزي في بنية واحدة متناسقة. وبدلًا من الاعتماد على تقنية واحدة، صُمّمت المنظومة للجمع بين قدرات متكاملة بحسب البيئة التشغيلية.',
frag:'معلومات مشتتة',integ:'وعي تشغيلي متكامل',
s3t:'منظومة Rescue Lantern',
comps:[['سوار الإنقاذ','جهاز ذكي قابل للارتداء مصمَّم لدعم مراقبة الأفراد والكشف عن الطوارئ والاتصال منخفض الطاقة ووظائف الإنقاذ عن قرب.','المستشعرات بحسب الإعداد: معدل ضربات القلب، SpO₂، الحرارة، الحركة، حالة البطارية، SOS يدوي.'],
['السترة الصناعية الذكية','منصة صناعية قابلة للارتداء لتوسيع مراقبة الأفراد بقدرة استشعار إضافية وتكامل نمطي ودعم للبيئات التشغيلية القاسية.','استشعار اختياري يعتمد على الإعداد: CO، الميثان، VOC، الضغط، المؤشرات الفسيولوجية.'],
['شبكة Gateway الذكية','عُقد اتصال ومعالجة طرفية موزعة مصمَّمة لجمع المعلومات التشغيلية وتصفية البيانات وتنظيمها وإرسال المهم منها عبر مسارات الاتصال المتاحة.','جمع البيانات · معالجة أولية · ربط الاتصال · سجل تشغيلي · مرونة الشبكة'],
['منظومة Seeker','أجهزة إنقاذ محمولة وثابتة مصمَّمة لمساعدة فرق البحث في كشف القرب والتنشيط المغناطيسي وتأكيد موقع المصاب عن قرب.','يمكن لأجهزة Seeker المحمولة تنشيط وظائف الإنقاذ في الأجهزة القابلة للارتداء المتوافقة عن قرب.'],
['عُقد ترحيل بالطائرات المسيّرة (اختيارية)','محطات ترحيل اتصال جوية قابلة للنشر لتوسيع الاتصال حين تكون البنية الثابتة غير متاحة أو غير كافية.','تحسين اختياري وليس مكوّنًا إلزاميًا في المنظومة الأساسية.'],
['مركز القيادة بالذكاء الاصطناعي','واجهة تشغيلية مركزية تجمع المعلومات الميدانية المتاحة لدعم الوعي بالحادث وتنسيق الموارد والتحليل التشغيلي واتخاذ القرار البشري.','الذكاء الاصطناعي يدعم القرار؛ وتبقى قرارات الإنقاذ النهائية بيد المشغّلين المسؤولين.'],
['التوأم الرقمي / النموذج التشغيلي','بيئة عرض تشغيلية تجمع معلومات البنية التحتية المتاحة مع البيانات الميدانية لمساعدة المنسّقين على تفسير حالة الأفراد ومناطق الحادث وحالة البنية التحتية وتقدم الإنقاذ.','مفهوم وبنية برمجية؛ ولا يُقدَّم كمنتج ثلاثي الأبعاد لحظي مُثبَت.']],

s4t:'من المراقبة الروتينية إلى دعم الإنقاذ عن قرب.',
st:[['المرحلة 01 — الوعي الروتيني','أثناء التشغيل الروتيني ترسل الأجهزة القابلة للارتداء المتوافقة معلومات تشغيلية خفيفة بشكل دوري إلى Gateways القريبة. وقد يساعد ذلك في الاحتفاظ بسجلات حالة الجهاز وسجل الاتصال وبيانات المراقبة المُعدّة الأخرى مع توفير الطاقة.'],
['المرحلة 02 — الاستجابة للطوارئ','عند رصد حالات الطوارئ المُعدّة، يمكن للجهاز الانتقال إلى وضع الطوارئ. وبحسب التنفيذ قد يشمل ذلك اتصالات ذات أولوية ومراقبة مستمرة للحادث والاستعداد لوظائف إنقاذ إضافية.'],
['المرحلة 03 — التأكيد عن قرب','تستخدم فرق الإنقاذ السجلات التشغيلية المتاحة ومعدات البحث لتضييق منطقة البحث. وعند اقتراب المسعفين من جهاز متوافق، يمكن لـ Seeker بدء التنشيط المغناطيسي منخفض التردد لتفعيل وظائف القرب المُعدّة، مثل إرسال المنارة المغناطيسية وإشارة القرب عبر Bluetooth والتنبيهات الصوتية.']],
tech:['اتصال منخفض الطاقة','LoRa (عند الإعداد)','Bluetooth Low Energy','التنشيط المغناطيسي منخفض التردد','اتصال مدعوم بالشبكة الشبكية (Mesh)','معالجة طرفية موزعة','دعم القرار بالذكاء الاصطناعي','عرض التوأم الرقمي'],

s5t:'مبني حول احتياجات العمليات عالية المخاطر.',s5p:'يهدف Rescue Lantern إلى دعم المؤسسات المسؤولة عن سلامة الأفراد والجاهزية للطوارئ في بيئات يصعب فيها الحفاظ على الوعي التشغيلي.',

intro:'Rescue Lantern — интегрированная экосистема аварийного реагирования для сложных условий, где привычные системы позиционирования и связи могут стать ненадёжными. Объединяя умные носимые устройства, устойчивую коммуникационную инфраструктуру, локальные спасательные технологии и оперативную визуализацию с поддержкой ИИ, проект призван повысить ситуационную осведомлённость до, во время и после аварии.',
cta1:'Обсудить партнёрство',cta2:'Изучить технологию',
s2t:'Создано для условий, где привычные системы могут отказать.',chT:'Проблема',
chP:'В подземных шахтах, тоннелях, замкнутых промышленных помещениях и конструктивно повреждённых зданиях спутниковое позиционирование может сильно ограничиваться, а обычная связь — нарушаться. В этом случае у спасателей может не быть полной информации о состоянии персонала, последних известных рабочих зонах, доступности связи и условиях среды.',
ch:['Ограниченная доступность связи','Слабая видимость состояния персонала','Сложность локализации пострадавших','Разрозненная оперативная информация'],
soT:'Подход Rescue Lantern',soP:'Rescue Lantern объединяет мониторинг персонала, многоуровневую связь, распределённую обработку, локальное обнаружение пострадавших и централизованную оперативную аналитику в единой архитектуре. Вместо опоры на одну технологию экосистема рассчитана на сочетание взаимодополняющих возможностей в зависимости от условий.',
frag:'РАЗРОЗНЕННАЯ ИНФОРМАЦИЯ',integ:'ЕДИНАЯ ОПЕРАТИВНАЯ КАРТИНА',
s3t:'Экосистема Rescue Lantern',
comps:[['Спасательный браслет','Умное носимое устройство для мониторинга персонала, обнаружения аварийных ситуаций, маломощной связи и спасательных функций на близком расстоянии.','Датчики зависят от конфигурации: пульс, SpO₂, температура, движение, состояние батареи, ручной SOS.'],
['Умный промышленный жилет','Промышленная носимая платформа, расширяющая мониторинг персонала дополнительными датчиками, модульной интеграцией и поддержкой тяжёлых условий эксплуатации.','Опциональные датчики, зависящие от конфигурации: CO, метан, ЛОС, давление, физиологические показатели.'],
['Сеть интеллектуальных Gateway','Распределённые узлы связи и периферийной обработки: сбор оперативной информации, фильтрация и упорядочивание данных, передача важного по доступным каналам.','Сбор данных · предварительная обработка · мост связи · оперативная история · устойчивость сети'],
['Система Seeker','Портативные и стационарные спасательные устройства для помощи поисковым группам: обнаружение близости, магнитная активация и подтверждение пострадавшего вблизи.','Портативные Seeker могут активировать спасательные функции совместимых носимых устройств на близком расстоянии.'],
['Опциональные дроны-ретрансляторы','Развёртываемые воздушные ретрансляторы для расширения связи, когда стационарная инфраструктура недоступна или недостаточна.','Опциональное усиление, не обязательное для базовой экосистемы.'],
['Командный центр с ИИ','Централизованный оперативный интерфейс, объединяющий доступную полевую информацию для осведомлённости об инциденте, координации ресурсов, анализа и принятия решений человеком.','ИИ поддерживает решения. Окончательные решения остаются за ответственными операторами.'],
['Цифровой двойник / оперативная модель','Среда визуализации, сочетающая доступные данные об инфраструктуре с полевыми данными и помогающая оценивать состояние персонала, зоны инцидента, инфраструктуру и ход спасения.','Концепция и программная архитектура; не позиционируется как проверенный 3D-продукт реального времени.']],
flow:['НОСИМЫЕ УСТРОЙСТВА + ДАТЧИКИ СРЕДЫ','GATEWAY + ДОСТУПНЫЕ КАНАЛЫ СВЯЗИ','ПЕРИФЕРИЙНАЯ ОБРАБОТКА + АГРЕГАЦИЯ ДАННЫХ','КОМАНДНЫЙ ЦЕНТР С ПОДДЕРЖКОЙ ИИ','ЦИФРОВАЯ ОПЕРАТИВНАЯ МОДЕЛЬ + РЕШЕНИЕ ЧЕЛОВЕКА'],
sk:'Портативные Seeker — вспомогательный компонент ближнего действия',dr:'Опциональные дроны-ретрансляторы — расширение связи',lg1:'Сплошные рамки: информационный поток базовой архитектуры',lg2:'Пунктирные рамки: вспомогательные/опциональные и концептуальные связи',
aiNote:'Возможности компонентов отражают замысел проекта, зависят от итоговой конфигурации и не являются независимо подтверждёнными характеристиками.',
s4t:'От рутинного мониторинга к спасению на близком расстоянии.',
st:[['ЭТАП 01 — ПОВСЕДНЕВНАЯ ОСВЕДОМЛЁННОСТЬ','В обычном режиме совместимые носимые устройства периодически передают компактные оперативные данные ближайшим Gateway. Это помогает вести записи о состоянии устройства, истории связи и других настроенных данных мониторинга, экономя энергию.'],
['ЭТАП 02 — АВАРИЙНОЕ РЕАГИРОВАНИЕ','При обнаружении настроенных аварийных условий устройство может перейти в аварийный режим. В зависимости от реализации это может включать приоритетную связь, продолжающийся мониторинг инцидента и готовность к дополнительным спасательным функциям.'],
['ЭТАП 03 — ПОДТВЕРЖДЕНИЕ ВБЛИЗИ','Спасатели используют доступные оперативные записи и поисковое оборудование, чтобы уточнить зону поиска. При приближении к совместимому устройству Seeker может инициировать низкочастотную магнитную активацию, включая настроенные функции ближнего действия: магнитный маяк, Bluetooth-сигнал близости и звуковой сигнал.']],
tech:['Маломощная связь','LoRa (при наличии в конфигурации)','Bluetooth Low Energy','Низкочастотная магнитная активация','Связь с поддержкой mesh-сети','Распределённая периферийная обработка','Поддержка решений на основе ИИ','Визуализация цифрового двойника'],
qual:'Эксплуатационные характеристики, покрытие связи и точность локализации зависят от конфигурации оборудования, наличия инфраструктуры, условий развёртывания и особенностей среды.',
s5t:'Создано для потребностей высокорисковых операций.',s5p:'Rescue Lantern предназначен для организаций, отвечающих за безопасность персонала и аварийную готовность там, где поддерживать оперативную осведомлённость особенно сложно.',
apps:['Подземная добыча','Метро и железные дороги','Строительство тоннелей','Промышленные объекты и опасные работы','Пожарные, спасательные службы и гражданская оборона','Критическая инфраструктура и управление ЧС'],
road:'Проект следует поэтапной стратегии: инженерная разработка, лабораторная валидация, полевая оценка, сертификация, начальное производство и расширение рынка. Это дорожная карта, а не утверждение, что все этапы завершены.',
paths:[['Техническая оценка','Изучение архитектуры, обсуждение требований к развёртыванию и оценка возможной технической интеграции.'],['Пилотное внедрение','Обсуждение требований к контролируемой полевой оценке и возможных операционных партнёров.'],['Стратегическое партнёрство','Промышленное сотрудничество, исследовательские партнёрства, производство, коммерциализация и инвестиции.']],
cta3:'Начать диалог',cta4:'Обсудить техническую оценку',ft:'Контакты',
close:'Rescue Lantern усиливает существующие процедуры аварийного реагирования за счёт интеллектуальной интеграции и создан для поддержки людей, принимающих критические решения.',
ph:'Телефон',em:'Эл. почта',wa:'WhatsApp',unset:'Пока не настроено',langLabel:'Язык'}};

const $=i=>document.getElementById(i),T=(i,v)=>{$(i).textContent=v},H=(i,v)=>{$(i).innerHTML=v};
const ph=v=>!v||/\[INSERT/.test(v);
const IC={phone:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.2a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>',mail:'<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/>',wa:'<path d="M3 21l1.7-5A9 9 0 1 1 8 19.3z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1-1.5-2-1-.8.8c-.8-.4-1.600-1.200-2-2l.8-.8-1-2z"/>'};
function contacts(l){const D=L[l],a=[['phone',D.ph,'PHONE_PRIMARY','tel:'],['phone',D.ph,'PHONE_SECONDARY','tel:'],['mail',D.em,'EMAIL_PRIMARY','mailto:'],['mail',D.em,'EMAIL_SECONDARY','mailto:'],['wa',D.wa,'WHATSAPP_PRIMARY',''],['wa',D.wa,'WHATSAPP_SECONDARY','']];
 H('ct',a.map(([ic,lb,k,sch])=>{const v=CONTACT[k],svg=`<svg viewBox="0 0 24 24" aria-hidden="true">${IC[ic]}</svg>`;
  if(ph(v))return `<span class="c off" role="note" aria-label="${lb}: ${D.unset}">${svg}<span>${lb} — ${v||D.unset}</span></span>`;
  const href=sch?sch+v.replace(/\s/g,''):v,ext=ic==='wa'?' target="_blank" rel="noopener noreferrer"':'';
  return `<a class="c" href="${href}"${ext} aria-label="${lb}: ${v}">${svg}<span>${ic==='wa'?lb:v}</span></a>`}).join(''))}
function apply(l,persist){const D=L[l];document.documentElement.lang=l;document.documentElement.dir=D.dir;document.title=D.title;
 document.querySelector('meta[name=description]').content=D.desc;document.querySelector('meta[property="og:title"]').content=D.title;
 H('links',D.nav.slice(1).map((n,i)=>`<a href="#${['s2','s3','s4','s5','contact'][i]}">${n}</a>`).join(''));
 ['award','awardNote','h1','sub','intro','cta1','cta2','s2t','chT','chP','soT','soP','frag','integ','s3t','aiNote','s4t','qual','s5t','s5p','road','cta3','cta4','ft','close'].forEach(k=>T(k==='awardNote'?'awardNote':k,D[k]));
 T('sk',D.sk);T('dr',D.dr);T('lg1',D.lg1);T('lg2',D.lg2);
 H('chL',D.ch.map(x=>`<li>${x}</li>`).join(''));
 H('comps',D.comps.map((c,i)=>`<div class="card"><h3>${c[0]}</h3><p>${c[1]}</p><p class="note" style="margin-top:10px;${i==1||i==4?'color:var(--cu2)':''}">${c[2]}</p></div>`).join(''));
 H('flow',D.flow.map((f,i)=>`<div class="node rtlok" style="direction:${D.dir}">${f}</div>`+(i<4?'<div class="arrow" aria-hidden="true">↓</div>':'')).join(''));
 H('tl',D.st.map(s=>`<div class="st"><h3>${s[0]}</h3><p class="p" style="margin:0;font-size:.95rem">${s[1]}</p></div>`).join(''));
 H('techs',D.tech.map(t=>`<span class="tag">${t}</span>`).join(''));
 H('apps',D.apps.map((a,i)=>`<div class="card"><span class="num" style="margin-bottom:10px;width:36px;height:36px">${String(i+1).padStart(2,'0')}</span><h3>${a}</h3></div>`).join(''));
 H('paths',D.paths.map(p=>`<div class="card"><h3 style="color:var(--cu2)">${p[0]}</h3><p>${p[1]}</p></div>`).join(''));
 $('lb').textContent=({en:'EN',fa:'FA',ar:'AR',ru:'RU'})[l]+' ▾';$('lb').setAttribute('aria-label',D.langLabel+': '+D.name);
 H('lm',Object.keys(L).map(k=>`<li role="option"><button data-l="${k}" lang="${k}" aria-current="${k===l}">${L[k].name}</button></li>`).join(''));
 contacts(l);
 if(persist)try{localStorage.setItem('rl_lang',l)}catch(e){}}
async function geoLang(){try{const c=new AbortController(),t=setTimeout(()=>c.abort(),1500);const r=await fetch(GEO_ENDPOINT,{signal:c.signal,cache:'no-store'});clearTimeout(t);if(!r.ok)return null;const s=await r.text();let cc;try{cc=JSON.parse(s).country}catch(e){cc=(s.match(/loc=([A-Z]{2})/)||[])[1]}return GEO_MAP[(cc||'').toUpperCase()]||null}catch(e){return null}}
function browserLang(){for(const n of (navigator.languages||[navigator.language||'']))if(L[n.slice(0,2).toLowerCase()])return n.slice(0,2).toLowerCase();return null}
let saved=null;try{saved=localStorage.getItem('rl_lang')}catch(e){}
if(saved&&L[saved])apply(saved);
else{const b=browserLang();apply(b||'en');
 geoLang().then(g=>{let s2=null;try{s2=localStorage.getItem('rl_lang')}catch(e){}if(s2)return;
  /* browser preference wins when it clearly names another supported language; geo is the tiebreaker */
  if(g&&(!b||b===g||b==='en'))apply(g)})}
$('lb').onclick=e=>{const o=$('lang').classList.toggle('open');$('lb').setAttribute('aria-expanded',o)};
$('lm').onclick=e=>{const l=e.target.closest('button')?.dataset.l;if(!l)return;const y=scrollY;apply(l,true);$('lang').classList.remove('open');$('lb').setAttribute('aria-expanded',false);scrollTo(0,y)};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('lang').classList.remove('open');$('lb').focus()}});
document.addEventListener('click',e=>{if(!e.target.closest('#lang'))$('lang').classList.remove('open')});
const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting)x.target.classList.add('in')}),{threshold:.08});
document.querySelectorAll('.rv').forEach(e=>io.observe(e));
</script>
